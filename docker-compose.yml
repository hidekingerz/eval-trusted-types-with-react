services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "${PROXY_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      LISTEN_ADDR: ":8080"
    expose:
      - "8080"
