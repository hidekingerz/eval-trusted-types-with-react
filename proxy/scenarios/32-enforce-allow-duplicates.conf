# Enforce sinks; 'react-eval'/'default' allowed and may be created more than once ('allow-duplicates').
<LocationMatch "^/[^/]+/enforce-allow-duplicates/">
    Header always set Content-Security-Policy "require-trusted-types-for 'script'; trusted-types react-eval default 'allow-duplicates'; report-uri /api/csp-report"
</LocationMatch>
