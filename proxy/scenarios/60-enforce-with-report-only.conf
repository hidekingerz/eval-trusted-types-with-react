# Enforce sinks, and additionally Report-Only a stricter policy-name allow-list ('react-eval' only).
<LocationMatch "^/[^/]+/enforce-with-report-only/">
    Header always set Content-Security-Policy "require-trusted-types-for 'script'; report-uri /api/csp-report"
    Header always set Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types react-eval; report-uri /api/csp-report"
</LocationMatch>
