# Realistic hardened CSP: Trusted Types plus script-src 'self', object-src 'none', base-uri 'none'.
<LocationMatch "^/[^/]+/enforce-strict/">
    Header always set Content-Security-Policy "require-trusted-types-for 'script'; trusted-types react-eval default; script-src 'self'; object-src 'none'; base-uri 'none'; report-uri /api/csp-report"
</LocationMatch>
