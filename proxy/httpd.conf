# Apache httpd configuration for the Trusted Types evaluation proxy.
#
# Roles:
#   * serve the pre-built React SPA (one build per React version under
#     /<react-version>/, e.g. /19.3/ and /19.2/)
#   * expose the same SPA under /<react-version>/<scenario>/ and attach the
#     CSP headers defined in conf/scenarios/<scenario>.conf to that location
#   * reverse-proxy /api/ to the Go backend
#
# Written for the official `httpd:2.4` image (ServerRoot /usr/local/apache2).

ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon
ServerName localhost
ServerTokens Prod

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h \"%r\" %>s %b csp=\"%{Content-Security-Policy}o\" cspro=\"%{Content-Security-Policy-Report-Only}o\"" tt
CustomLog /proc/self/fd/1 tt

TypesConfig conf/mime.types
AddType text/javascript .js .mjs
AddType application/json .json
AddDefaultCharset utf-8

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

# Hashed Vite assets are immutable; everything else must not be cached so
# that switching scenarios always re-fetches the document (and its headers).
<LocationMatch "^/[^/]+/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<FilesMatch "\.(html|json)$">
    Header set Cache-Control "no-store"
</FilesMatch>

# Landing page -> default scenario.
RedirectMatch 302 "^/$" "/19.3/none/"

# Backend (Go).
ProxyPreserveHost On
ProxyRequests Off
ProxyPass        "/api/" "http://${BACKEND_UPSTREAM}/api/"
ProxyPassReverse "/api/" "http://${BACKEND_UPSTREAM}/api/"

# One file per CSP scenario (an optional "NN-" prefix orders them). The entrypoint also creates
# htdocs/<react-version>/<scenario>/index.html for every file found here.
IncludeOptional conf/scenarios/*.conf
